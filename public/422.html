<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Demande refusée (422) | La Pieuvre</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
  @font-face {
    font-family: 'Gotham';
    src: url('/fonts/Gotham-Book.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
  }

  @font-face {
    font-family: 'Gotham';
    src: url('/fonts/Gotham-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
  }

  @font-face {
    font-family: 'Pluto';
    src: url('/fonts/PlutoBold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
  }

  :root {
    --orange: #ea5137;
    --white: #ffffff;
    --black: #000000;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background-color: var(--black);
    color: var(--white);
    font-family: 'Gotham', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .error-page {
    width: 90%;
    max-width: 40em;
    padding: 2em 0;
  }

  .error-code {
    margin: 0;
    font-family: 'Pluto', Arial, sans-serif;
    font-size: clamp(5em, 20vw, 9em);
    line-height: 1;
    color: var(--orange);
  }

  .error-title {
    margin: 0.4em 0 0.6em;
    font-family: 'Pluto', Arial, sans-serif;
    font-size: clamp(1.5em, 4vw, 2.2em);
    font-weight: 700;
    color: var(--white);
  }

  .error-text {
    margin: 0 0 2em;
    color: var(--white);
    line-height: 1.6;
  }

  .error-link {
    display: inline-block;
    padding: 0.8em 1.8em;
    border: 1px solid var(--orange);
    color: var(--white);
    text-decoration: none;
    font-weight: 700;
    transition: background-color 0.2s, color 0.2s;
  }

  .error-link:hover,
  .error-link:focus {
    background-color: var(--orange);
    color: var(--black);
  }
  </style>
</head>

<body>
  <main class="error-page">
    <p class="error-code">422</p>
    <h1 class="error-title">Demande refusée</h1>
    <p class="error-text">La modification demandée n'a pas pu être effectuée.</p>
    <a class="error-link" href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
